<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎡 转盘抽签模拟器</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #e94560;
    --gold: #f5c518;
    --text: #eee;
    --text2: #aaa;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
  }
  .container {
    width: 100%;
    max-width: 540px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  /* Header */
  .header {
    text-align: center;
  }
  .header h1 {
    font-size: 2rem;
    background: linear-gradient(135deg, #e94560, #f5c518, #e94560);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s ease infinite;
  }
  @keyframes shimmer {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* Wheel */
  .wheel-wrapper {
    position: relative;
    width: 340px;
    height: 340px;
    flex-shrink: 0;
  }
  .pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 32px solid var(--gold);
    filter: drop-shadow(0 2px 6px rgba(245,197,24,0.6));
    transition: transform 0.15s;
  }
  .pointer.bouncing {
    animation: pointerBounce 0.12s steps(1) infinite;
  }
  @keyframes pointerBounce {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(6px); }
  }
  canvas {
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(233,69,96,0.25), 0 0 80px rgba(233,69,96,0.08);
    transition: box-shadow 0.4s;
  }
  canvas.spinning {
    box-shadow: 0 0 60px rgba(245,197,24,0.5), 0 0 120px rgba(233,69,96,0.2);
  }

  /* Draw count */
  .draw-count {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border-radius: var(--radius);
    padding: 10px 20px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .draw-count label {
    font-size: 0.95rem;
    white-space: nowrap;
  }
  .draw-count input {
    width: 52px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
    text-align: center;
    font-weight: 600;
  }
  .draw-count input:focus {
    outline: none;
    border-color: var(--accent);
  }

  /* Names input */
  .names-section {
    width: 100%;
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .names-section h3 {
    font-size: 0.95rem;
    margin-bottom: 10px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .count-badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 0.82rem;
    font-weight: 700;
    padding: 3px 14px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }
  .names-section textarea {
    width: 100%;
    height: 120px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12);
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
    resize: vertical;
    font-family: inherit;
    line-height: 1.6;
  }
  .names-section textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .names-hint {
    font-size: 0.78rem;
    color: var(--text2);
    margin-top: 6px;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    padding: 12px 28px;
    border-radius: 999px;
    border: none;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    letter-spacing: 0.5px;
  }
  .btn-spin {
    background: linear-gradient(135deg, var(--accent), #ff6b81);
    color: #fff;
    font-size: 1.2rem;
    padding: 14px 48px;
    box-shadow: 0 4px 20px rgba(233,69,96,0.4);
  }
  .btn-spin:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(233,69,96,0.55); }
  .btn-spin:active { transform: translateY(0); }
  .btn-spin:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 2px solid rgba(255,255,255,0.2);
  }
  .btn-outline:hover { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.05); }
  .btn-sm {
    padding: 6px 14px;
    font-size: 0.8rem;
  }

  /* Results */
  .results {
    width: 100%;
    min-height: 40px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
  }
  .result-tag {
    display: inline-block;
    padding: 10px 22px;
    background: linear-gradient(135deg, #f5c518, #f0a500);
    color: #1a1a2e;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1.1rem;
    animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 3px 14px rgba(245,197,24,0.35);
  }
  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* History */
  .history {
    width: 100%;
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 18px;
    border: 1px solid rgba(255,255,255,0.08);
    max-height: 200px;
    overflow-y: auto;
  }
  .history h3 {
    font-size: 0.9rem;
    margin-bottom: 10px;
    color: var(--text2);
    display: flex;
    align-items: center;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 0.9rem;
  }
  .history-item:last-child { border-bottom: none; }
  .history-names { color: var(--gold); font-weight: 600; }
  .history-time { color: var(--text2); font-size: 0.75rem; white-space: nowrap; margin-left: 12px; }

  /* Confetti canvas */
  #confetti {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 999;
  }

  /* Footer */
  .footer {
    text-align: center;
    font-size: 0.78rem;
    color: var(--text2);
    padding-bottom: 20px;
  }
  .footer a { color: var(--accent); text-decoration: none; }

  /* Responsive */
  @media (max-width: 400px) {
    .wheel-wrapper { width: 280px; height: 280px; }
    .btn-spin { padding: 12px 36px; font-size: 1.1rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎡 转盘抽签模拟器</h1>
  </div>

  <!-- Wheel -->
  <div class="wheel-wrapper" id="wheelWrapper">
    <div class="pointer" id="pointer"></div>
    <canvas id="wheelCanvas" width="680" height="680"></canvas>
  </div>

  <!-- Draw count -->
  <div class="draw-count">
    <label for="drawNum">抽取人数：</label>
    <input type="number" id="drawNum" value="1" min="1" max="100">
    <span style="font-size:0.85rem;color:var(--text2)">/ <span id="totalCount">0</span> 人</span>
  </div>

  <!-- Names input -->
  <div class="names-section">
    <h3>📝 参与名单（每行一个名字） <span id="nameCountBadge" class="count-badge">0 人</span></h3>
    <textarea id="nameInput" placeholder="张三&#10;李四&#10;王五&#10;赵六&#10;小明&#10;小红">张三
李四
王五
赵六
小明
小红</textarea>
    <div class="names-hint">💡 每行一个名字，支持中英文、emoji，逗号分隔也可</div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-spin" id="btnSpin">🎯 开始抽签</button>
    <button class="btn btn-outline btn-sm" id="btnClear">清空结果</button>
    <button class="btn btn-outline btn-sm" id="btnShare">🔗 分享</button>
  </div>

  <!-- Results -->
  <div class="results" id="results"></div>

  <!-- History -->
  <div class="history" id="history">
    <h3>
      📋 抽取记录
      <button class="btn btn-outline btn-sm" id="btnClearHistory" style="margin-left:auto;">清空记录</button>
    </h3>
    <div id="historyList" style="color:var(--text2);font-size:0.85rem;">暂无记录</div>
  </div>

  <div class="footer">
    转盘抽签模拟器 · 公平随机 · <a href="https://github.com" target="_blank">GitHub</a>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
(function() {
  // ─── DOM refs ────────────────────────────────
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const pointer = document.getElementById('pointer');
  const nameInput = document.getElementById('nameInput');
  const drawNumInput = document.getElementById('drawNum');
  const totalCountEl = document.getElementById('totalCount');
  const btnSpin = document.getElementById('btnSpin');
  const btnClear = document.getElementById('btnClear');
  const btnShare = document.getElementById('btnShare');
  const btnClearHistory = document.getElementById('btnClearHistory');
  const nameCountBadge = document.getElementById('nameCountBadge');
  const resultsDiv = document.getElementById('results');
  const historyList = document.getElementById('historyList');
  const confettiCanvas = document.getElementById('confetti');
  const confettiCtx = confettiCanvas.getContext('2d');

  // ─── State ───────────────────────────────────
  let names = [];
  let results = [];
  let history = [];
  let spinning = false;
  let currentRotation = 0;   // radians
  let wheelRadius = 300;     // draw radius on 680px canvas
  const cx = 340, cy = 340;

  // Confetti
  let confettiParticles = [];
  let confettiRAF = null;

  // ─── Audio (tick sound via Web Audio API) ────
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function playTick() {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.06, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.06);
    } catch(e) { /* silent */ }
  }
  function playWin() {
    try {
      const ctx = getAudioCtx();
      [523, 659, 784, 1047].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
        gain.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.25);
        osc.start(ctx.currentTime + i * 0.1);
        osc.stop(ctx.currentTime + i * 0.1 + 0.25);
      });
    } catch(e) { /* silent */ }
  }

  // ─── Colors ──────────────────────────────────
  const palette = [
    '#e94560', '#f5c518', '#0f3460', '#533483',
    '#00b4d8', '#e76f51', '#2a9d8f', '#f4a261',
    '#264653', '#a855f7', '#ec4899', '#14b8a6',
    '#f97316', '#6366f1', '#84cc16', '#06b6d4',
    '#8b5cf6', '#ef4444', '#22c55e', '#3b82f6',
  ];

  function getColor(i, total) {
    return palette[i % palette.length];
  }

  // ─── Draw wheel ──────────────────────────────
  function drawWheel(rotationOffset) {
    ctx.clearRect(0, 0, 680, 680);
    const n = names.length;
    if (n === 0) {
      // Empty wheel
      ctx.beginPath();
      ctx.arc(cx, cy, wheelRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#2a2a4a';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#888';
      ctx.font = 'bold 24px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('请添加名单', cx, cy);
      return;
    }

    const sliceAngle = (Math.PI * 2) / n;

    for (let i = 0; i < n; i++) {
      const startAngle = rotationOffset + i * sliceAngle;
      const endAngle = startAngle + sliceAngle;

      // Slice
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, wheelRadius, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = getColor(i, n);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Text
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(startAngle + sliceAngle / 2);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const textRadius = wheelRadius * 0.7;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 4;
      const name = names[i];
      const displayName = name.length > 6 ? name.slice(0, 6) + '…' : name;
      ctx.fillText(displayName, textRadius, 0);
      ctx.restore();
    }

    // Center dot
    ctx.beginPath();
    ctx.arc(cx, cy, 28, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 28);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.6, '#ddd');
    grad.addColorStop(1, '#999');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Outer ring
    ctx.beginPath();
    ctx.arc(cx, cy, wheelRadius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 6;
    ctx.stroke();
  }

  // ─── Parse names ─────────────────────────────
  function parseNames() {
    const raw = nameInput.value.trim();
    names = raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
    // Deduplicate while preserving order
    const seen = new Set();
    names = names.filter(n => {
      if (seen.has(n)) return false;
      seen.add(n);
      return true;
    });
    updateCounts();
    drawWheel(currentRotation);
  }

  function updateCounts() {
    totalCountEl.textContent = names.length;
    nameCountBadge.textContent = names.length + ' 人';
    drawNumInput.max = names.length;
    const cur = parseInt(drawNumInput.value) || 1;
    if (cur > names.length) drawNumInput.value = names.length;
    if (cur < 1) drawNumInput.value = names.length > 0 ? 1 : 0;
  }

  // ─── Spin animation ──────────────────────────
  function spin() {
    if (spinning) return;
    if (names.length === 0) {
      alert('请先添加参与名单！');
      return;
    }
    const drawCount = Math.min(parseInt(drawNumInput.value) || 1, names.length);
    if (drawCount < 1) return;

    spinning = true;
    btnSpin.disabled = true;
    canvas.classList.add('spinning');
    pointer.classList.add('bouncing');
    resultsDiv.innerHTML = '';
    results = [];

    // Pick random winners from remaining pool
    const pool = [...names];
    const winners = [];
    for (let i = 0; i < drawCount; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      winners.push(pool.splice(idx, 1)[0]);
    }

    // Animate spin for each winner sequentially, but spin the wheel
    // We'll do one big spin that lands on the last winner's sector,
    // then reveal winners one by one
    const steps = 40 + Math.floor(Math.random() * 30); // ~2-3 seconds at 60fps
    let step = 0;

    // Target: pointer at top (12 o'clock = -π/2). Slice center angle is
    // rotationOffset + (index + 0.5) * sliceAngle. We want that to equal -π/2 (top).
    // So targetRotation = -π/2 - (targetIndex + 0.5) * sliceAngle
    const targetIdx = names.indexOf(winners[winners.length - 1]);
    const sliceAngle = (Math.PI * 2) / names.length;
    const targetAngle = -Math.PI / 2 - (targetIdx + 0.5) * sliceAngle;

    // Normalize: add enough full rotations so we end at targetAngle
    const fullSpins = (5 + Math.floor(Math.random() * 4)) * Math.PI * 2;
    const startRotation = currentRotation;
    const endRotation = startRotation + fullSpins + (targetAngle - (startRotation % (Math.PI * 2)));
    // Ensure targetAngle is the effective end
    const targetMod = ((targetAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const totalSpin = fullSpins + ((targetMod - ((startRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);

    const startTime = performance.now();
    const duration = 2500 + Math.random() * 800;
    const tickInterval = 60; // ms between ticks
    let lastTick = 0;

    function animate(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);

      // Ease-out (cubic)
      const eased = 1 - Math.pow(1 - progress, 4);
      currentRotation = startRotation + totalSpin * eased;

      // Tick sound
      const tickProgress = Math.floor(elapsed / tickInterval);
      if (tickProgress > lastTick && progress < 0.95) {
        playTick();
        lastTick = tickProgress;
      }

      drawWheel(currentRotation);

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        // Done spinning
        onSpinComplete(winners);
      }
    }

    requestAnimationFrame(animate);
  }

  function onSpinComplete(winners) {
    spinning = false;
    btnSpin.disabled = false;
    canvas.classList.remove('spinning');
    pointer.classList.remove('bouncing');
    playWin();
    launchConfetti();

    // Reveal winners one by one
    results = winners;
    winners.forEach((name, i) => {
      setTimeout(() => {
        const tag = document.createElement('span');
        tag.className = 'result-tag';
        tag.style.animationDelay = '0s';
        tag.textContent = (winners.length > 1 ? `🎉 ` : '🏆 ') + name;
        resultsDiv.appendChild(tag);
      }, i * 300);
    });

    // Add to history
    const now = new Date();
    const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    history.unshift({ names: winners, time: timeStr });
    if (history.length > 50) history.length = 50;
    renderHistory();
  }

  // ─── Confetti ────────────────────────────────
  function launchConfetti() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
    const colors = ['#e94560','#f5c518','#00b4d8','#2a9d8f','#f4a261','#a855f7','#ec4899','#22c55e'];
    confettiParticles = [];

    for (let i = 0; i < 120; i++) {
      confettiParticles.push({
        x: Math.random() * confettiCanvas.width,
        y: -20 - Math.random() * 200,
        w: 6 + Math.random() * 8,
        h: 4 + Math.random() * 10,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 4,
        vy: 2 + Math.random() * 6,
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 0.3,
        opacity: 1,
      });
    }

    if (confettiRAF) cancelAnimationFrame(confettiRAF);
    let startTime = performance.now();
    function renderConfetti(now) {
      const elapsed = (now - startTime) / 1000;
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

      let alive = false;
      for (const p of confettiParticles) {
        if (elapsed > 2.5) p.opacity = Math.max(0, p.opacity - 0.03);
        if (p.opacity <= 0) continue;
        alive = true;

        p.x += p.vx;
        p.vy += 0.08;
        p.y += p.vy;
        p.rot += p.rotV;

        confettiCtx.save();
        confettiCtx.globalAlpha = Math.min(1, p.opacity);
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate(p.rot);
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        confettiCtx.restore();
      }

      if (alive && elapsed < 3.5) {
        confettiRAF = requestAnimationFrame(renderConfetti);
      } else {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        confettiRAF = null;
      }
    }
    confettiRAF = requestAnimationFrame(renderConfetti);
  }

  // ─── History rendering ───────────────────────
  function renderHistory() {
    if (history.length === 0) {
      historyList.innerHTML = '<span style="color:var(--text2);font-size:0.85rem;">暂无记录</span>';
      return;
    }
    historyList.innerHTML = history.map(h =>
      `<div class="history-item">
        <span class="history-names">${h.names.map(n => '🏆 ' + n).join('  ')}</span>
        <span class="history-time">${h.time}</span>
      </div>`
    ).join('');
  }

  // ─── Clear ───────────────────────────────────
  function clearResults() {
    results = [];
    resultsDiv.innerHTML = '';
  }

  function clearHistory() {
    history = [];
    renderHistory();
    showToast('✅ 抽取记录已清空');
  }

  // ─── Share ───────────────────────────────────
  function share() {
    const url = window.location.href;
    const text = `🎡 转盘抽签模拟器\n当前名单：${names.length} 人`;

    if (navigator.share) {
      navigator.share({ title: '转盘抽签模拟器', text, url }).catch(() => {});
    } else {
      navigator.clipboard.writeText(url).then(() => {
        showToast('✅ 链接已复制到剪贴板！');
      }).catch(() => {
        prompt('复制此链接分享：', url);
      });
    }
  }

  function showToast(msg) {
    const toast = document.createElement('div');
    toast.textContent = msg;
    toast.style.cssText = `
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: 12px 24px; border-radius: 999px;
      font-size: 0.95rem; z-index: 9999; pointer-events: none;
      animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
    `;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2200);
  }

  // Add toast styles
  const toastStyle = document.createElement('style');
  toastStyle.textContent = `
    @keyframes toastIn { 0% { opacity:0; transform:translateX(-50%) translateY(20px); } 100% { opacity:1; transform:translateX(-50%) translateY(0); } }
    @keyframes toastOut { 0% { opacity:1; transform:translateX(-50%) translateY(0); } 100% { opacity:0; transform:translateX(-50%) translateY(-20px); } }
  `;
  document.head.appendChild(toastStyle);

  // ─── Event listeners ─────────────────────────
  nameInput.addEventListener('input', parseNames);
  drawNumInput.addEventListener('input', () => {
    let v = parseInt(drawNumInput.value);
    if (isNaN(v) || v < 1) drawNumInput.value = 1;
    if (v > names.length) drawNumInput.value = names.length;
  });
  btnSpin.addEventListener('click', spin);
  btnClear.addEventListener('click', clearResults);
  btnClearHistory.addEventListener('click', clearHistory);
  btnShare.addEventListener('click', share);

  // Keyboard shortcut
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      spin();
    }
  });

  // ─── Init ────────────────────────────────────
  function init() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
    parseNames();
    renderHistory();
  }

  window.addEventListener('resize', () => {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  });

  init();
})();
</script>
</body>
</html>
